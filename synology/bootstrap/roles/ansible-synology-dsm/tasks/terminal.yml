- name: Enable/Disable SSH/Telnet
  synology_dsm_api_request:
    api_name: SYNO.Entry.Request
    api_method: request
    api_version: 1
    request_method: POST
    api_params:
      stop_on_error: 'false'
      mode: sequential
      compound: >-
        {{ [
          {
            "api": "SYNO.Core.Terminal",
            "method": "set",
            "version": "3",
            "enable_telnet": synology_dsm_telnet_enable,
            "enable_ssh": synology_dsm_ssh_enable,
            "ssh_port": synology_dsm_ssh_port
          }
        ] | to_json }}
