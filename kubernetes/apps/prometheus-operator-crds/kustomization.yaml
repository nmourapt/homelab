apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prometheus Operator CRDs, managed via GitOps.
#
# Previously these CRDs were applied manually (out-of-band) because the
# kube-prometheus-stack chart runs with `crds.enabled: false`. That left them
# orphaned: the chart advanced the operator to v0.91.0 while the CRDs stayed at
# v0.88.1, causing ArgoCD to fail syncing the monitoring app with:
#   .spec.hostNetwork: field not declared in schema
#
# This app pins the CRDs to the chart version whose appVersion matches the
# running operator (v0.91.0 -> prometheus-operator-crds chart 29.0.0). Keep this
# in lockstep with the prometheus-operator image in apps/monitoring.
helmCharts:
  - name: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: 32.0.0
    releaseName: prometheus-operator-crds
