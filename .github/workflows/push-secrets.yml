name: Push SOPS Secrets to Forgejo

on:
  push:
    branches: [main]
    paths:
      - 'secrets/reposecrets.sops.yml'
  workflow_dispatch:

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install SOPS
      run: |
        wget https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64
        chmod +x sops-v3.10.2.linux.amd64
        sudo mv sops-v3.10.2.linux.amd64 /usr/local/bin/sops

    - name: Install age
      run: |
        wget https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz
        tar xzf age-v1.1.1-linux-amd64.tar.gz
        sudo mv age/age /usr/local/bin/
        sudo mv age/age-keygen /usr/local/bin/

    - name: Set up age key
      run: |
        mkdir -p ~/.config/sops/age
        echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
        chmod 600 ~/.config/sops/age/keys.txt

    - name: Decrypt and push secrets
      env:
        FORGEJO_TOKEN: ${{ secrets.SECRETS_TOKEN }}
      run: |
        set -euo pipefail

        sops -d secrets/reposecrets.sops.yml > decrypted_secrets.yml

        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

        FORGEJO_URL="${GITHUB_SERVER_URL:-https://git.nmoura.pt}"
        REPO_OWNER=$(cut -d'/' -f1 <<< "$GITHUB_REPOSITORY")
        REPO_NAME=$(cut -d'/' -f2 <<< "$GITHUB_REPOSITORY")

        SECRET_KEYS=$(yq eval 'keys | .[] | select(. != "sops")' decrypted_secrets.yml)

        while IFS= read -r secret_name; do
          [ -n "$secret_name" ] || continue
          secret_value=$(yq eval ".$secret_name" decrypted_secrets.yml)
          echo "Updating secret: $secret_name"
          curl -sf -X PUT \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg v "$secret_value" '{data: $v}')" \
            "$FORGEJO_URL/api/v1/repos/$REPO_OWNER/$REPO_NAME/actions/secrets/$secret_name"
        done <<< "$SECRET_KEYS"

        echo "All secrets updated successfully"

    - name: Cleanup
      if: always()
      run: |
        rm -f decrypted_secrets.yml
        rm -rf ~/.config/sops/
